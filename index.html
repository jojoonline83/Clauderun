<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/panda.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>小宝学华文 | Chinese Learning Adventure</title>
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        background: #f97316;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }
      #root {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        background: #fff;
        position: relative;
        overflow-x: hidden;
      }
      #splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 12px;
        font-family: system-ui, sans-serif;
      }
      #splash span { font-size: 72px; }
      #splash p { font-size: 16px; color: #6b7280; margin: 0; }
      #err {
        display: none;
        background: #fef2f2;
        border: 2px solid #f87171;
        border-radius: 12px;
        margin: 20px;
        padding: 16px;
        font-family: monospace;
        font-size: 12px;
        color: #b91c1c;
        word-break: break-all;
        white-space: pre-wrap;
      }
    </style>
    <!-- Global error catcher — catches any JS crash before React mounts -->
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('err');
        if (el) {
          el.style.display = 'block';
          el.textContent = 'JS Error:\n' + msg + '\nFile: ' + src + '\nLine: ' + line;
        }
        var splash = document.getElementById('splash');
        if (splash) splash.style.display = 'none';
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('err');
        if (el) {
          el.style.display = 'block';
          el.textContent = 'Promise Error:\n' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
        }
        var splash = document.getElementById('splash');
        if (splash) splash.style.display = 'none';
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <span>🐼</span>
        <p>小宝学华文 Loading...</p>
      </div>
      <div id="err"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
